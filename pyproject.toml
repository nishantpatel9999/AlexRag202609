[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alexrag"
version = "0.1.0"
description = "AlexRag202609 MVP scaffold: RAG + multi-agent paper trading (no live paths)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
alexrag = "alexrag.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
