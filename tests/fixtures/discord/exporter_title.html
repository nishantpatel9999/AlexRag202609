<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>DiscordChatExporter title= timestamps (no time datetime)</title>
</head>
<body>
<div class="chatlog">
  <div class="chatlog__message-group">
    <div id="chatlog__message-container-4001" class="chatlog__message-container" data-message-id="4001">
      <div class="chatlog__message">
        <div class="chatlog__message-aside">
          <img class="chatlog__avatar" src="avatar.png" alt="Avatar"/>
        </div>
        <div class="chatlog__message-primary">
          <div class="chatlog__header">
            <span class="chatlog__author" title="alex_primetrading" data-user-id="42">Alex</span>
            <span class="chatlog__timestamp" title="Monday, October 3, 2022 6:37 AM">
              <a href="#chatlog__message-container-4001">10/3/2022 6:37 AM</a>
            </span>
          </div>
          <div class="chatlog__content chatlog__markdown">
            <span class="chatlog__markdown-preserve">long 1/2p TH @ 13.09 (SL @ 12.78)</span>
          </div>
        </div>
      </div>
    </div>
    <div id="chatlog__message-container-4002" class="chatlog__message-container" data-message-id="4002">
      <div class="chatlog__message">
        <div class="chatlog__message-aside">
          <div class="chatlog__short-timestamp" title="Monday, October 3, 2022 7:51 AM">7:51 AM</div>
        </div>
        <div class="chatlog__message-primary">
          <div class="chatlog__content chatlog__markdown">
            <span class="chatlog__markdown-preserve">added 1/2p LABU @ 7.62</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
