# Fixture operator config for offline Exec / M0 replay. Not for production.
# Non-zero hard_limits + paper.nav let a cleared proposal exercise Exec without live keys.
# config/default.yaml stays at 0 (fail-closed).

mode: paper
kill_switch: false
fail_closed: true

retrieval:
  min_confidence: 0.2
  stale_after_hours: 36
  top_k: 8
  precedence:
    - trade_log
    - journal
    - gameplan
    - report
    - gitbook

paper_gates:
  min_sessions: 60
  min_decisions: 100

hard_limits:
  max_notional: 1000.0
  max_positions: 1
  max_daily_loss: 50.0
  max_portfolio_dd: 0.02

paper:
  nav: 100000.0
  fill_model: M0
  venue: paper_sim
  bars_path: tests/fixtures/m0/bars.json

paths:
  audit_log: data/audit/events.jsonl
  gitbook_snapshot: data/gitbook

embedding:
  provider: fake
  dim: 32
