# Fixture operator config for offline Exec / M0 replay. Not for production.
# Same Nishant-locked pcts as default.yaml; paper.nav lets dollars derive at runtime.
# config/default.yaml keeps paper.nav at 0 (fail-closed dollar derivation).

mode: paper
kill_switch: false
fail_closed: true

retrieval:
  min_confidence: 0.2
  stale_after_hours: 36
  top_k: 8
  precedence:
    - trade_log
    - journal
    - gameplan
    - report
    - pf_update
    - gitbook

paper_gates:
  min_sessions: 60
  min_decisions: 100

hard_limits:
  max_notional_pct: 1.5
  max_positions: 15
  max_daily_loss_pct: 0.10
  max_portfolio_dd: 0.25
  notional_breach_policy: pro_rata_trim_for_new_entry

paper:
  nav: 100000.0
  fill_model: M0
  venue: paper_sim
  bars_path: tests/fixtures/m0/bars.json

paper_book:
  daily_loss: 0.0
  portfolio_dd: 0.0
  sessions: 0
  decisions: 0

paths:
  audit_log: data/audit/events.jsonl
  gitbook_snapshot: data/gitbook

embedding:
  provider: fake
  dim: 32

llm:
  provider: inferhub.dev
  model: GLM 5.3-flash
