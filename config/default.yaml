# AlexRag202609 default config. Mode is paper-only.
# Hard-limit values are operator-owned placeholders, not research outputs.
# Keep hard_limits and paper.nav at 0 (fail-closed). Use config/fixture.yaml for M0 replay.

mode: paper
kill_switch: false
fail_closed: true

retrieval:
  min_confidence: 0.2
  stale_after_hours: 36
  top_k: 8
  # equity fills/closes > same-time journal > morning gameplan > evening prime-report > GitBook doctrine
  precedence:
    - trade_log
    - journal
    - gameplan
    - report
    - gitbook

paper_gates:
  # Promotion is gate-driven. There is no target live date in this repo.
  min_sessions: 60
  min_decisions: 100

hard_limits:
  max_notional: 0.0
  max_positions: 0
  max_daily_loss: 0.0
  max_portfolio_dd: 0.0

paper:
  nav: 0.0
  fill_model: M0
  venue: paper_sim

paper_book:
  # Diagnostics + Risk loss/DD snapshot. 0 is no breach; limits at 0 still fail-closed.
  daily_loss: 0.0
  portfolio_dd: 0.0
  sessions: 0
  decisions: 0

paths:
  audit_log: data/audit/events.jsonl
  gitbook_snapshot: data/gitbook

embedding:
  provider: fake
  dim: 32
