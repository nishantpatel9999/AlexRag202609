# AlexRag202609 default config. Mode is paper-only.
# Nishant-locked operator hard limits (pcts of paper equity). Dollar notional
# and dollar daily-loss are derived from paper.nav at runtime.
# paper.nav 0 fail-closes go-decisions (cannot derive dollars). Use
# config/fixture.yaml (same pcts + nav) for M0 replay. Secrets stay in env.

mode: paper
kill_switch: false
fail_closed: true

retrieval:
  min_confidence: 0.2
  stale_after_hours: 36
  top_k: 8
  # equity fills/closes > same-time journal > morning gameplan > evening prime-report
  # > pf-update (portfolio snapshots, not a fill log) > GitBook doctrine
  precedence:
    - trade_log
    - journal
    - gameplan
    - report
    - pf_update
    - gitbook

paper_gates:
  # Promotion is gate-driven. There is no target live date in this repo.
  min_sessions: 60
  min_decisions: 100

hard_limits:
  max_notional_pct: 1.5      # 150% of paper equity (dollars = nav * pct)
  max_positions: 15
  max_daily_loss_pct: 0.10   # 10% of paper equity (dollars = nav * pct)
  max_portfolio_dd: 0.25     # 25% of paper equity
  notional_breach_policy: pro_rata_trim_for_new_entry  # trim open book pro-rata to make room for a new entry

paper:
  nav: 0.0
  fill_model: M0
  venue: paper_sim

paper_book:
  # daily_loss is dollars; portfolio_dd is a fraction of equity.
  # 0 is no breach; nav 0 still fail-closes dollar derivation.
  daily_loss: 0.0
  portfolio_dd: 0.0
  sessions: 0
  decisions: 0

paths:
  audit_log: data/audit/events.jsonl
  gitbook_snapshot: data/gitbook

embedding:
  provider: fake
  dim: 32

# Always-on LLM. Inferhub host + cbcn upstream only. Key via INFERHUB_API_KEY env.
llm:
  base_url: https://api.inferhub.dev/v1
  provider: cbcn
  model: GLM-5.3-flash
